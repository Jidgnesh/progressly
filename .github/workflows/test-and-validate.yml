name: Test and Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Validate manifest
        run: python3 -m json.tool public/manifest.json > /dev/null

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output missing"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "dist/index.html missing"
            exit 1
          fi
          echo "Build output valid"
